[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[server]
  path = "/api/*"

[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/seller/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account/*"
  to = "/index.html"
  status = 200
